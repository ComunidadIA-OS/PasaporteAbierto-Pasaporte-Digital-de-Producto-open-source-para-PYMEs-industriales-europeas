name: 💡 Propuesta de mejora
description: Sugiere una funcionalidad o mejora.
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ¿Quieres añadir cobertura de un **sector regulatorio** nuevo? Usa la plantilla
        "Nuevo plugin sectorial" en su lugar.
  - type: textarea
    id: problema
    attributes:
      label: Problema o necesidad
      description: ¿Qué problema resuelve esto para un fabricante PYME generando su DPP?
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Solución propuesta
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
  - type: checkboxes
    id: invariantes
    attributes:
      label: Encaje con el diseño
      description: Revisa docs/ARCHITECTURE.md y CONTRIBUTING.md antes de proponer.
      options:
        - label: Mantiene el caso de uso (PYME industrial europea generando su DPP).
        - label: No convierte en deterministas los pasos IA (Clasificador, Recolector) ni a la inversa sin justificación.
        - label: No reintroduce decisiones descartadas (LangChain, PostgreSQL/Redis, multi-tenant/OAuth) sin justificación nueva.
