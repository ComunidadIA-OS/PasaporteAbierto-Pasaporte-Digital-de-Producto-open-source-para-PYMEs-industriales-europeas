name: 🐛 Informe de error
description: Reporta un comportamiento incorrecto del sistema.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. Para vulnerabilidades de **seguridad** no uses este formulario:
        sigue [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del error
      description: ¿Qué ocurre? Sé concreto.
    validations:
      required: true
  - type: textarea
    id: reproduccion
    attributes:
      label: Pasos para reproducir
      description: Pasos numerados desde un estado limpio.
      placeholder: |
        1. `docker compose up -d --build`
        2. Abrir http://localhost:3000 y crear un DPP de tipo batería
        3. En el paso 5 (extracción)…
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: dropdown
    id: componente
    attributes:
      label: Componente afectado
      options:
        - Backend / API
        - Frontend / wizard
        - Pipeline IA (Clasificador / Recolector)
        - RAG / corpus normativo
        - Generación / firma del DPP
        - Plugins (YAML sectorial)
        - Docker / despliegue
        - Otro / no lo sé
    validations:
      required: true
  - type: textarea
    id: entorno
    attributes:
      label: Entorno
      description: Versión, SO, `MODEL_BACKEND`, local vs Docker.
      placeholder: |
        - Versión / commit:
        - SO:
        - MODEL_BACKEND (ollama / anthropic / openai…):
        - Ejecución: docker compose / local
  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      description: Pega logs o trazas. **No incluyas secretos ni datos sensibles.**
      render: shell
