[project]
name = "pasaporteabierto-backend"
version = "0.1.0"
description = "Backend FastAPI para PasaporteAbierto"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "pydantic==2.*",
    "pydantic-settings==2.*",
    "sqlmodel==0.0.22",
    "alembic==1.13.*",
    "pyyaml==6.*",
    "litellm==1.52.*",
    "langfuse==2.*",
    "httpx==0.27.*",
    "beautifulsoup4==4.12.*",
    "lxml==5.*",
    "chromadb==0.5.*",
    "sentence-transformers==3.*",
]

[dependency-groups]
dev = [
    "pytest==8.*",
    "pytest-asyncio==0.24.*",
    "ruff==0.7.*",
    "pytest-cov==5.*",
    "pytest-json-report==1.5.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "slow: tests que descargan el modelo bge-m3 (~2 GB) o tocan ChromaDB; omitir con -m 'not slow'",
]
