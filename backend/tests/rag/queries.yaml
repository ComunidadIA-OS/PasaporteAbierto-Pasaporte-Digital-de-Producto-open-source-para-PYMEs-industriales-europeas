# Citas esperadas alineadas con el articulado REAL de los reglamentos
# (verificado contra los títulos oficiales en EUR-Lex), no con los fixtures
# de prueba. En el ESPR (UE 2024/1781): Art. 9 "Pasaporte digital del
# producto" establece qué productos lo necesitan; Art. 10 "Requisitos
# aplicables al pasaporte digital del producto" fija los requisitos esenciales
# y el vínculo con el identificador único. (El Art. 7 es "Requisitos de
# información" y no trata del DPP.)
- id: espr-pasaporte-art9-1
  query: "¿Qué productos deben tener pasaporte digital de producto?"
  expected_citation:
    reglamento: "UE 2024/1781"
    articulo: "9"
  idioma: es
  tags: [espr, alcance]

- id: espr-pasaporte-art9-en
  query: "Which products require a digital product passport?"
