services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./plugins:/app/plugins:ro
      # Monta scripts/ para que el endpoint /api/v1/demo/* (gated por
      # DEMO_MODE) pueda leer scripts/e2e_demo/config.yaml — misma fuente
      # de verdad que el runner E2E CLI.
      - ./scripts:/app/scripts:ro
      - backend_data:/app/data
    depends_on:
      langfuse:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        # Next inlinea NEXT_PUBLIC_* en build time. Cambiar DEMO_MODE en
        # .env exige `docker compose up --build frontend` para que se
        # propague al bundle del cliente.
        NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-false}
        # Nombre de la cookie de sesión que el proxy de Next comprueba para
        # gatear /wizard y /panel. Debe coincidir con AUTH_COOKIE_NAME (backend).
        NEXT_PUBLIC_AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-pa_session}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3010:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3010
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme-langfuse-secret}
      SALT: ${LANGFUSE_SALT:-changeme-langfuse-salt}
      TELEMETRY_ENABLED: "false"
    depends_on:
      langfuse-db:
        condition: service_healthy

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Init container: espera a que ollama responda y descarga el modelo
  # declarado en MODEL_BACKEND (.env). Idempotente — `ollama pull` no
  # re-descarga si ya está. Sale al terminar.
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_started
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh"]
    command:
      - "-c"
      - |
        set -e
        until ollama list >/dev/null 2>&1; do
          echo "[ollama-init] esperando al servidor ollama..."
          sleep 2
        done
        MODEL="$${MODEL_BACKEND#ollama:}"
        MODEL="$${MODEL:-qwen2.5:7b}"
        echo "[ollama-init] asegurando modelo $$MODEL (descarga si no está)..."
        ollama pull "$$MODEL"
        echo "[ollama-init] ✓ modelo $$MODEL listo."
    restart: "no"

volumes:
  backend_data:
  langfuse_db_data:
  ollama_data:
