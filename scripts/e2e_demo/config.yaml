# Config de demo E2E para el wizard de PasaporteAbierto.
# El runner (run.py) recorre los 7 pasos contra http://localhost:8000.
#
# Edita los valores de `bom.fields` para probar variantes (p. ej. battery_category=ev
# para activar la validación cruzada `capacity_exhaustion_required_for_ev`).

api_base: "http://localhost:8000"
public_base: "http://localhost:8000"   # mismo host: el frontend monta /dpp en backend

# Paso 1: descripción libre del producto (≥20 chars)
description: >-
  Batería industrial recargable de iones de litio (Li-NMC) de 5 kWh, formato pack
  estacionario para almacenamiento residencial de excedentes fotovoltaicos.
  Instalación fija interior, tensión nominal 50V, capacidad asignada 100 Ah.

# Paso 3: BOM. TODOS los `required: true` del plugin batteries.yaml deben estar aquí.
# Valores inspirados en una batería estacionaria Li-ion ~5 kWh tipo Powerwall.
bom:
  fields:
    # --- Anexo XIII §1: pública ---
    battery_passport_unique_id: "URN:UUID:DEMO-PW5-2025-000042"
    battery_serial_number: "PWA-5K-2025-00042"
    manufacturer_identifier: "DEMO-MFG-ESP-001"
    battery_category: "industrial"
    manufacturing_place: "Madrid, España"
    manufacturing_date: "2025-11-15"
    battery_mass_kg: 52.3
    extinguishing_agent: "Polvo ABC / agua nebulizada (no usar CO2 sobre celdas)"

    battery_chemistry: "li_ion"
    hazardous_substances:
      - { name: "Hexafluorofosfato de litio (LiPF6)", cas: "21324-40-3", concentration_pct: 1.2 }
      - { name: "Carbonato de etileno", cas: "96-49-1", concentration_pct: 18.5 }
    critical_raw_materials:
      - { name: "Litio", supply_chain_country: "Chile" }
      - { name: "Cobalto", supply_chain_country: "RDC" }
      - { name: "Níquel", supply_chain_country: "Indonesia" }

    carbon_footprint_kgco2e_per_kwh: 68.4
    carbon_footprint_study_url: "https://demo-mfg.example/lca/pw5-2025.pdf"

    due_diligence_report_url: "https://demo-mfg.example/diligence/2025.pdf"

    recycled_content_cobalt_pct: 16.0
    recycled_content_lithium_pct: 6.0
    recycled_content_nickel_pct: 6.0
    recycled_content_lead_pct: 0.0

    renewable_content_pct: 0.0

    rated_capacity_ah: 100.0

    voltage_min_v: 42.0
    voltage_nominal_v: 50.0
    voltage_max_v: 58.0

    original_power_capability_w: 5000.0
    max_permitted_power_w: 7000.0

    expected_lifetime_cycles: 6000
    cycle_life_reference_test: "IEC 61960-3:2017 @ 0.5C, 100%DoD, 25ºC"

    idle_temperature_min_c: -10.0
    idle_temperature_max_c: 45.0

    warranty_period_months: 120

    roundtrip_efficiency_initial_pct: 92.5
    roundtrip_efficiency_mid_lifecycle_pct: 88.0

    internal_resistance_cell_ohm: 0.012
    internal_resistance_pack_ohm: 0.085

    cycle_life_test_c_rate: 0.5

    marking_requirements_url: "https://demo-mfg.example/marking/pw5.pdf"
    eu_declaration_of_conformity_url: "https://demo-mfg.example/doc/pw5-doc.pdf"
    waste_management_info_url: "https://demo-mfg.example/waste/pw5.pdf"
    environmental_health_impact_info_url: "https://demo-mfg.example/health/pw5.pdf"

    # --- Anexo XIII §2: legitimate_interest ---
    composition_cathode: "NMC811 (LiNi0.8Mn0.1Co0.1O2)"
    composition_anode: "Grafito sintético con recubrimiento SiOx (5%)"
    composition_electrolyte: "LiPF6 1M en EC:EMC:DMC (3:5:2 v/v) + 2% VC"
    component_part_numbers:
      - { ref: "CELL-NMC811-50Ah", qty: 14 }
      - { ref: "BMS-CTRL-V3", qty: 1 }
      - { ref: "HOUSING-AL-5KW", qty: 1 }
    spare_parts_sources_url: "https://demo-mfg.example/spares/pw5.html"
    dismantling_info_url: "https://demo-mfg.example/dismantling/pw5.pdf"
    safety_measures_url: "https://demo-mfg.example/safety/pw5.pdf"

    # --- Anexo XIII §3: authorities_only ---
    conformity_test_reports_url: "https://demo-mfg.example/conformity/pw5-test-reports.pdf"

# Paso 4: documentos. El runner los genera con reportlab y los sube.
# Cada doc contiene los campos `embeds` literales para que el Recolector
# (paso 5, LLM) los pueda extraer y marcar como `verified`.
documents:
  - doc_type: datasheet
    title: "Datasheet PowerWall PW5 — Modelo 2025"
    embeds:
      - "battery_serial_number: PWA-5K-2025-00042"
      - "manufacturer_identifier: DEMO-MFG-ESP-001"
      - "battery_chemistry: Li-ion (NMC811)"
      - "rated_capacity_ah: 100 Ah"
      - "voltage_nominal_v: 50 V"
      - "voltage_min_v: 42 V"
      - "voltage_max_v: 58 V"
      - "battery_mass_kg: 52.3 kg"
      - "warranty_period_months: 120 meses"
      - "expected_lifetime_cycles: 6000 ciclos"
      - "roundtrip_efficiency_initial_pct: 92.5 %"

  - doc_type: ce_declaration
    title: "Declaración UE de Conformidad — PW5 2025"
    embeds:
      - "Fabricante: DEMO-MFG-ESP-001"
      - "Modelo: PWA-5K-2025-00042"
      - "battery_category: industrial"
      - "manufacturing_place: Madrid, España"
      - "manufacturing_date: 2025-11-15"
      - "Cumple Reglamento UE 2023/1542 Anexo IX"

  - doc_type: certificate
    title: "Certificado de Conformidad Art. 41 — Notified Body 0123"
    embeds:
      - "battery_serial_number: PWA-5K-2025-00042"
      - "Procedimiento: Módulo D1 + módulo G según Art. 41"
      - "Notified Body: 0123 — TÜV Demo"
      - "Fecha emisión: 2025-11-10"

  - doc_type: lca
    title: "Análisis de Ciclo de Vida — PW5 2025"
    embeds:
      - "carbon_footprint_kgco2e_per_kwh: 68.4"
      - "Método: PEFCR baterías v1.2"
      - "recycled_content_cobalt_pct: 16 %"
      - "recycled_content_lithium_pct: 6 %"
      - "recycled_content_nickel_pct: 6 %"
