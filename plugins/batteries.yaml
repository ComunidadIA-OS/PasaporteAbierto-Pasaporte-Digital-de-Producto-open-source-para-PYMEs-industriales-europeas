name: "batteries"
regulation: "EU 2023/1542"
version: "0.1.0"
description: "Plugin del Reglamento UE 2023/1542 sobre pilas y baterías. v0.1.0 cubre las 3 secciones estáticas del Anexo XIII (Sección 1 pública, Sección 2 interés legítimo, Sección 3 autoridades) para baterías industriales >2 kWh y vehículos eléctricos. Sección 4 (datos individuales dinámicos) queda fuera del alcance del wizard — corresponde a telemetría operativa post-registro."
identifier_scheme: "iso_iec_15459"   # Art. 77.3 de Reg. UE 2023/1542

fields:
  # ═══ Anexo XIII Sección 1 — INFO PÚBLICA DEL MODELO ═══

  # (1a) → Anexo VI Parte A, expandido a sub-campos
  - id: battery_passport_unique_id
    label: "Identificador unico del pasaporte"
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Art. 77.3 (identificador único conforme ISO/IEC 15459)"
  - id: battery_serial_number
    label: "Numero de serie"
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Art. 38.6; Anexo IX"
  - id: manufacturer_identifier
    label: "Identificador del fabricante"
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo VI Parte A(1); Art. 38.7"
  - id: battery_category
    label: "Categoria de bateria"
    type: enum
    required: true
    access_level: public
    enum_values: [lmt, industrial, ev, sli, stationary, portable]
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1a); Anexo VI Parte A(2); Art. 38.6"
  - id: manufacturing_place
    label: "Lugar de fabricacion"
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1a); Anexo VI Parte A(3)"
  - id: manufacturing_date
    label: "Fecha de fabricacion"
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1a); Anexo VI Parte A(4)"
  - id: battery_mass_kg
    label: "Peso de la bateria (kg)"
    type: number
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1a); Anexo VI Parte A(5)"
  - id: extinguishing_agent
    label: "Agente extintor"
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1a); Anexo VI Parte A(9)"

  # (1b) composición material
  - id: battery_chemistry
    label: "Quimica de la bateria"
    type: enum
    required: true
    access_level: public
    enum_values: [li_ion, lifepo4, ni_mh, ni_cd, lead_acid, na_ion, other]
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1b); Anexo VI Parte A(7)"
  - id: hazardous_substances
    label: "Sustancias peligrosas"
    type: repeater
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1b); Anexo VI Parte A(8)"
  - id: critical_raw_materials
    label: "Materias primas criticas"
    type: repeater
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1b); Anexo VI Parte A(10)"

  # (1c) huella de carbono
  - id: carbon_footprint_kgco2e_per_kwh
    label: "Huella de carbono (kgCO2e/kWh)"
    type: number
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1c); Art. 7.1"
  - id: carbon_footprint_study_url
    label: "URL del estudio de huella de carbono"
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1c); Art. 7.1(g)"

  # (1d) diligencia debida
  - id: due_diligence_report_url
    label: "URL del informe de diligencia debida"
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1d); Art. 52.3"

  # (1e) contenido reciclado
  - id: recycled_content_cobalt_pct
    label: "Contenido reciclado de cobalto (%)"
    type: number
    required: true
    access_level: public
    validation: ">=0 and <=100"
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1e); Art. 8.1"
  - id: recycled_content_lithium_pct
    label: "Contenido reciclado de litio (%)"
    type: number
    required: true
    access_level: public
    validation: ">=0 and <=100"
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1e); Art. 8.1"
  - id: recycled_content_nickel_pct
    label: "Contenido reciclado de niquel (%)"
    type: number
    required: true
    access_level: public
    validation: ">=0 and <=100"
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1e); Art. 8.1"
  - id: recycled_content_lead_pct
    label: "Contenido reciclado de plomo (%)"
    type: number
    required: true
    access_level: public
    validation: ">=0 and <=100"
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1e); Art. 8.1"

  # (1f) contenido renovable
  - id: renewable_content_pct
    label: "Contenido renovable (%)"
    type: number
    required: true
    access_level: public
    validation: ">=0 and <=100"
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1f)"

  # (1g) capacidad asignada (Ah) — Anexo XIII literal: "amperios-hora"
  - id: rated_capacity_ah
    label: "Capacidad nominal (Ah)"
    type: number
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1g)"

  # (1h) tensiones mín/nominal/máx
  - id: voltage_min_v
    label: "Tension minima (V)"
    type: number
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1h)"
  - id: voltage_nominal_v
    label: "Tension nominal (V)"
    type: number
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1h)"
  - id: voltage_max_v
    label: "Tension maxima (V)"
    type: number
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1h)"

  # (1i) capacidad de potencia original + límites
  - id: original_power_capability_w
    label: "Potencia original (W)"
    type: number
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1i); Art. 10; Anexo IV Parte B(4)"
  - id: max_permitted_power_w
    label: "Potencia maxima permitida (W)"
    type: number
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1i)"

  # (1j) vida útil prevista + prueba de referencia
  - id: expected_lifetime_cycles
    label: "Ciclos de vida esperados"
    type: integer
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1j); Anexo IV Parte A(5)"
  - id: cycle_life_reference_test
    label: "Ensayo de referencia del ciclo de vida"
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1j)"

  # (1k) límite de capacidad para agotamiento — solo EV
  - id: capacity_exhaustion_threshold_pct
    label: "Umbral de agotamiento de capacidad (%)"
    type: number
    required: false   # condicional: solo aplicable a EV (validar en cross_validation)
    access_level: public
    validation: ">=0 and <=100"
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1k) — solo vehículos eléctricos"

  # (1l) rango temperatura en reposo
  - id: idle_temperature_min_c
    label: "Temperatura minima en reposo (C)"
    type: number
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1l)"
  - id: idle_temperature_max_c
    label: "Temperatura maxima en reposo (C)"
    type: number
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1l)"

  # (1m) garantía
  - id: warranty_period_months
    label: "Periodo de garantia (meses)"
    type: integer
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1m)"

  # (1n) eficiencia round-trip inicial + al 50% del ciclo
  - id: roundtrip_efficiency_initial_pct
    label: "Eficiencia ida y vuelta inicial (%)"
    type: number
    required: true
    access_level: public
    validation: ">=0 and <=100"
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1n); Art. 10; Anexo IV(6)"
  - id: roundtrip_efficiency_mid_lifecycle_pct
    label: "Eficiencia ida y vuelta a mitad de vida (%)"
    type: number
    required: true
    access_level: public
    validation: ">=0 and <=100"
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1n); Anexo IV(6)"

  # (1o) resistencia interna celda + pack
  - id: internal_resistance_cell_ohm
    label: "Resistencia interna de celda (ohm)"
    type: number
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1o); Art. 10; Anexo IV Parte A(3)"
  - id: internal_resistance_pack_ohm
    label: "Resistencia interna del pack (ohm)"
    type: number
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1o); Anexo IV Parte A(3)"

  # (1p) C-rate de la prueba ciclo de vida
  - id: cycle_life_test_c_rate
    label: "C-rate del ensayo de ciclo de vida"
    type: number
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1p)"

  # (1q) marcado del Art. 13.3 y .4
  - id: marking_requirements_url
    label: "URL de requisitos de marcado"
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1q); Art. 13.3-4"

  # (1r) Declaración UE de conformidad — NO es Art. 19 (CE marking), es Art. 18
  - id: eu_declaration_of_conformity_url
    label: "URL de la declaracion UE de conformidad"
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1r); Art. 18"

  # (1s) info gestión de residuos (Art. 74.1.a-f consolidado en 2 URLs)
  - id: waste_management_info_url
    label: "URL de informacion de gestion de residuos"
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1s); Art. 74.1.a-e"
  - id: environmental_health_impact_info_url
    label: "URL de impacto ambiental y sanitario"
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (1s); Art. 74.1.f"

  # ═══ Anexo XIII Sección 2 — INTERÉS LEGÍTIMO + COMISIÓN ═══

  - id: composition_cathode
    label: "Composicion del catodo"
    type: string
    required: true
    access_level: legitimate_interest
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (2a)"
  - id: composition_anode
    label: "Composicion del anodo"
    type: string
    required: true
    access_level: legitimate_interest
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (2a)"
  - id: composition_electrolyte
    label: "Composicion del electrolito"
    type: string
    required: true
    access_level: legitimate_interest
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (2a)"
  - id: component_part_numbers
    label: "Numeros de pieza de componentes"
    type: repeater
    required: true
    access_level: legitimate_interest
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (2b)"
  - id: spare_parts_sources_url
    label: "URL de fuentes de repuestos"
    type: string
    required: true
    access_level: legitimate_interest
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (2b)"
  - id: dismantling_info_url
    label: "URL de informacion de desmontaje"
    type: string
    required: true
    access_level: legitimate_interest
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (2c)"
  - id: safety_measures_url
    label: "URL de medidas de seguridad"
    type: string
    required: true
    access_level: legitimate_interest
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (2d); Art. 74.2"

  # ═══ Anexo XIII Sección 3 — SOLO AUTORIDADES Y COMISIÓN ═══

  - id: conformity_test_reports_url
    label: "URL de informes de ensayo de conformidad"
    type: string
    required: true
    access_level: authorities_only
    citation:
      regulation: "EU 2023/1542"
      article: "Anexo XIII (3); Anexo VIII Parte A(2h)"

  # ═══ Anexo XIII Sección 4 — INTENCIONALMENTE FUERA DEL ALCANCE ═══
  #
  # La Sección 4 (a-d) describe datos dinámicos por batería individual:
  # parámetros de rendimiento (Art. 10.1) al introducirse en el mercado y en cambios
  # de estado, SoH (Art. 14), estado del ciclo de vida ("original" / "adaptado" /
  # "reutilizado" / "remanufacturado" / "residuo"), número de ciclos consumidos,
  # accidentes, temperatura operativa y SoC. Son emitidos por el BMS y la operación,
  # NO por el fabricante al registrar el modelo. Quedan fuera del alcance del wizard
  # del hackathon y se modelarán en una fase futura como pipeline de telemetría
  # separado del plugin. Ver `docs/ARCHITECTURE.md` §"Identificador único y niveles
  # de acceso del DPP" y `docs/FUNCIONAL.md` §9.2.

required_documents:
  - type: datasheet
    mandatory: true
    citation:
      regulation: "EU 2023/1542"
      article: "Art. 38 (información mínima del producto); Anexo VIII"
  - type: ce_declaration
    mandatory: true
    citation:
      regulation: "EU 2023/1542"
      article: "Art. 18 (Declaración UE de conformidad); Anexo IX"
  - type: certificate
    mandatory: true
    when: "battery_category in [industrial, ev]"
    citation:
      regulation: "EU 2023/1542"
      article: "Art. 41 (procedimientos de evaluación de la conformidad)"
  - type: lca
    mandatory: true
    when: "rated_capacity_ah * voltage_nominal_v / 1000 > 2"   # >2 kWh
    citation:
      regulation: "EU 2023/1542"
      article: "Art. 7 (huella de carbono); Anexo II"
  # SDS sigue el Reglamento REACH (UE 1907/2006 Art. 31), no el 2023/1542 — sin
  # citation aquí: la API devuelve citation=null para este documento.
  - type: sds
    mandatory: false

# Las `rule` strings expresan la lógica en una sintaxis ilustrativa (operadores tipo
# Python). El evaluador del Verificador (paso 6 del wizard) las interpretará en F3
# o F6; hasta entonces sirven como contrato legible para el fabricante y para
# tests que parseen su intención. El umbral de 500 ciclos en `lifetime_min_cycles`
# es un piso conservador para industrial/EV (Anexo IV Parte A(5) lo modula por
# subcategoría; el plugin futuro puede afinar por `battery_category`).
cross_validations:
  - id: voltage_consistency
    rule: "voltage_min_v <= voltage_nominal_v <= voltage_max_v"
    message: "Las tensiones declaradas deben cumplir min ≤ nominal ≤ max (Anexo XIII (1h))"
  - id: idle_temp_consistency
    rule: "idle_temperature_min_c < idle_temperature_max_c"
    message: "El rango de temperatura en reposo debe tener mínimo menor que máximo (Anexo XIII (1l))"
  - id: lifetime_min_cycles
    rule: "expected_lifetime_cycles >= 500"
    message: "Por debajo de 500 ciclos, revisar Anexo IV Parte A(5) del Reglamento UE 2023/1542"
  - id: capacity_exhaustion_required_for_ev
    rule: "battery_category != 'ev' or capacity_exhaustion_threshold_pct != null"
    message: "El límite de capacidad para agotamiento es obligatorio para baterías de vehículos eléctricos (Anexo XIII (1k))"
