name: "textile"
regulation: "EU 2024/1781"
version: "0.1.0"
description: "Plugin del sector textil para validar la extensibilidad de la arquitectura por configuración (F6-04). El Reglamento UE 2024/1781 (ESPR) es el marco base; el acto delegado específico para textil todavía no se ha publicado, por lo que los campos se citan contra el Art. 7 del ESPR (información del producto en el DPP) y reglamentos complementarios aplicables (REACH para SVHC, ISO 3758 para símbolos de cuidado). Todos los campos quedan en access_level=public hasta que el acto delegado sectorial fije una sección equivalente al Annex XIII del Reg. UE 2023/1542."
identifier_scheme: "gs1_digital_link"   # default por ADR 0001 (sin acto delegado específico)

fields:
  # ═══ Identificación del producto (ESPR Art. 7) ═══

  - id: product_name
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1 (información del producto en el DPP)"

  - id: manufacturer_name
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1 (identificación del fabricante)"

  - id: gtin
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 9 (identificador único del producto)"

  - id: manufacturing_date
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1 (fecha de fabricación)"

  - id: manufacturing_place
    type: string
    required: true
    access_level: public
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1 (lugar de fabricación)"

  - id: textile_category
    type: enum
    required: true
    access_level: public
    enum_values: [outerwear, underwear, bedding, towels, technical_textile, footwear, accessories, other]
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1 (categoría del producto)"

  # ═══ Composición material (ESPR Art. 7.1.b) ═══

  - id: fiber_composition
    type: repeater
    required: true
    access_level: public
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1.b (composición del producto: nombre de fibra + porcentaje en masa)"

  - id: primary_fiber_origin_country
    type: string
    required: false
    access_level: public
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1.b (origen geográfico de las fibras principales)"

  - id: chemical_treatments_applied
    type: string
    required: false
    access_level: public
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1.b (tratamientos químicos aplicados al tejido)"

  # ═══ Trazabilidad (ESPR Art. 7.1.c) ═══

  - id: base_fabric_supplier_id
    type: string
    required: false
    access_level: public
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1.c (trazabilidad: identificación del proveedor del tejido base)"

  - id: recycled_content_present
    type: boolean
    required: false
    access_level: public
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1.f (presencia de material reciclado)"

  - id: recycled_content_percent
    type: number
    required: false
    access_level: public
    validation: ">=0 and <=100"
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1.f (porcentaje en masa de fibras recicladas)"

  # ═══ Etiquetado y cuidados ═══

  - id: care_instructions
    type: string
    required: false
    access_level: public
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1.e (instrucciones de uso y cuidado)"

  - id: care_symbols_iso_3758
    type: string
    required: false
    access_level: public
    citation:
      regulation: "ISO 3758:2012"
      article: "Símbolos de cuidado textil (lavado, blanqueo, secado, planchado, limpieza profesional)"

  - id: labeling_languages
    type: string
    required: false
    access_level: public
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1.e (idiomas del etiquetado conforme al país de comercialización)"

  # ═══ Sostenibilidad / circularidad ═══

  - id: recyclability_declared
    type: enum
    required: false
    access_level: public
    enum_values: [high, medium, low, none]
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1.d (reciclabilidad declarada del producto)"

  - id: sustainability_certifications
    type: repeater
    required: false
    access_level: public
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1.g (certificaciones de sostenibilidad: OEKO-TEX, GOTS, GRS, Bluesign, etc.)"

  # ═══ Sustancias preocupantes (REACH) ═══

  - id: svhc_present
    type: boolean
    required: true
    access_level: public
    citation:
      regulation: "EC 1907/2006 (REACH)"
      article: "Art. 33 (información sobre sustancias en artículos: declaración de presencia de SVHC)"

  - id: svhc_substances
    type: repeater
    required: false
    access_level: public
    citation:
      regulation: "EC 1907/2006 (REACH)"
      article: "Art. 33 (lista de SVHC presentes: CAS number + nombre de la sustancia)"

required_documents:
  - type: datasheet
    mandatory: true
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1 (ficha técnica del producto con composición y características)"

  - type: certificate
    mandatory: false
    when: "recycled_content_percent > 0"
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1.f (certificado del contenido reciclado declarado: GRS, RCS u equivalente)"

  - type: lca
    mandatory: false
    citation:
      regulation: "EU 2024/1781"
      article: "Art. 7.1.g (análisis de ciclo de vida del producto)"

# Las reglas cruzadas usan la misma sintaxis ilustrativa (operadores tipo Python)
# que el plugin de baterías; el evaluador del Verificador (paso 6) las interpretará
# en F3 o F6.
cross_validations:
  - id: recycled_content_requires_certificate
    rule: "recycled_content_percent == null or recycled_content_percent == 0 or recycled_content_present == true"
    message: "Si declaras un porcentaje de contenido reciclado > 0, debes marcar recycled_content_present=true y adjuntar el certificado correspondiente (Art. 7.1.f del Reglamento UE 2024/1781)."

  - id: svhc_list_requires_flag
    rule: "svhc_present == true or svhc_substances == null"
    message: "Si declaras SVHC concretos en svhc_substances, debes marcar svhc_present=true (Art. 33 del Reglamento REACH 1907/2006)."
